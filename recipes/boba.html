<body>
    <h1>Boba</h1>
    <img src="../images/boba.png">
    <h2> Ingredients </h2>
    <ul> 
        <li>2 tsp Dry tapioca pearls</li>
        <li>500ml milk tea</li>
    </ul>
    <h2> Steps </h2>
    <ol> 
        <li>Boil the pearls in ~ 300ml water for 8 minutes</li>
        <li>Strain the pearls, add to milk tea</li>
    </ol>
