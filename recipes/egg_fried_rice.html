    <img src="images/rice.jpg">
    <h2> Ingredients </h2>
    <ul>
        <li>2 eggs</li>
        <li>1 bowl of leftover rice</li>
        <li>1/2 can of spam</li>
        <li>1 cup frozen peas</li>
    </ul>
    <h2> Steps </h2>
    <ol>
        <li>Crack eggs and wisk</li>
        <li>Microwave frozen peas (one minute) </li>
        <li>Heat pan to high</li>
        <li>fry</li>
